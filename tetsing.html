<!doctype html>

<html lang="en">

<head>

<meta charset="utf-8">
<title>Blank template</title>

<style> 
body {
  background-color: black;
}
button {
  background-color: rgba(255, 255, 255, 0.05);
  border: none;
  outline: rgba(255, 255, 255, 0.1) solid 1.5px;
  color: white;
  padding: 15px 32px;
  text-align: center;
  font-size: 16px;
  margin: 4px 2px;
  cursor: pointer;
  border-radius:10px;
  font-weight: bold;
}
button:hover {
  outline: #04AA6D solid 2px;
}
p {
  color: white;
  font-size: 16px;
  font-family: Arial, Helvetica, sans-serif;
}
#imageContainer {
    display: flex;
    flex-wrap: wrap; /* Ensures images wrap once they fill a row */
}
.tinyBlock {
  border: 5px solid;  
  height: 50px;
  width: 50px;
  image-rendering: -webkit-optimize-contrast; /* Chrome, Edge, Opera, and Safari */
  image-rendering: crisp-edges;
}
.title {
  font-weight: bold;
}
.green {
  background-color: rgba(150, 255, 180, 0.1);
  outline: rgba(150, 255, 180, 0.3) solid 1.5px;
}
.green:hover {
  outline: #04AA6D solid 2px;
  background-color: rgba(150, 255, 180, 0.2);
}
.red {
  background-color: rgba(255, 120, 150, 0.1);
  outline: rgba(255, 120, 150, 0.3) solid 1.5px;
}
.red:hover {
  outline: rgba(255, 80, 100, 1) solid 2px;
  background-color: rgba(255, 120, 150, 0.2);
}
.block {
  height: 100px;
  width: 100px;
  image-rendering: -webkit-optimize-contrast; /* Chrome, Edge, Opera, and Safari */
  image-rendering: crisp-edges;
}
#testingContainer {
  text-align: center;
}
#testingClippingContainer {
  height: 0;
  overflow: clip;
  transition: 1s;
}
</style>

</head>

<button class="green" id="start" onclick="start()">Start</button>
<div id="testingClippingContainer">
<div id="testingContainer">
<p class="title" id="CurrentBlock"></p>
<img class="block" id="i"/>
<br/>

<button class="green" style="width:127px" onclick="keepBlock()">Keep</button>
<button class="red" style="width:127px" onclick="discardBlock()">Discard</button>
<br/>
<br/>
<button onclick="averageTextureColor()">Average Color</button>
<span>|</span>
<button onclick="undo()">↺</button>


<div id="imageContainer"></div>

<p style="font-size:10px; text-align:left;" id="BlockList">none</p>

</div>
</div>
<script>

var i = 0;
var blocksArray = [];

function undo() {
  i--;
  i--;
  nextBlock();
  if (blocksArray[blocksArray.length-1][0] == textureArray[i][0]) {
    document.getElementById("CurrentBlock").innerHTML = "yes";
    blocksArray.pop();
    displayArrayInParagraph(blocksArray);

    const div = document.getElementById('imageContainer');
    div.removeChild(div.lastElementChild);
  }
}

function keepBlock() {
  let tempArray = textureArray[i];
  var rgb = getAverageRGB(document.getElementById('i'));
  tempArray.push([rgb.r,rgb.g,rgb.b]);
  blocksArray.push([tempArray[0],tempArray[1],tempArray[2]]);
  displayArrayInParagraph(blocksArray);

  const testingContainer = document.getElementById("testingContainer");
  testingClippingContainer.style.height = (document.getElementById('testingContainer').clientHeight+40) + "px";

  const container = document.getElementById('imageContainer');
  const newImage = document.createElement('img');

  // Set a default image source (you can change it to your desired URL)
  newImage.src = 'https://raw.githubusercontent.com/ZtechNetwork/MCBVanillaResourcePack/master/'+tempArray[1];
  newImage.classList.add('tinyBlock');
  newImage.style.borderColor = 'rgb('+rgb.r+','+rgb.g+','+rgb.b+')';

  // Append the new image to the container
  container.appendChild(newImage);

  nextBlock();
}

function discardBlock() {
  nextBlock();
}

function displayArrayInParagraph(array) {
  // Get the paragraph element by its ID
  const paragraph = document.getElementById('BlockList');

  // Convert each item in the array to a string representation
  const arrayString = array.map(item => JSON.stringify(item)).join(',<br>');

  // Update the paragraph content with the formatted array string
  paragraph.innerHTML = `[<br>${arrayString}<br>]`;
}

function nextBlock() {
  i++;
  document.getElementById("CurrentBlock").innerHTML = (i+1) + ": " + textureArray[i][0];
  var img = document.getElementById('i');
  img.crossOrigin = '';
  img.src = 'https://raw.githubusercontent.com/ZtechNetwork/MCBVanillaResourcePack/master/'+textureArray[i][1];

}


function averageTextureColor() {
    var rgb = getAverageRGB(document.getElementById('i'));
    document.body.style.backgroundColor = 'rgb('+rgb.r+','+rgb.g+','+rgb.b+')';
}
    
function getAverageRGB(imgEl) {
    
    var blockSize = 1, // only visit every 5 pixels
        defaultRGB = {r:0,g:0,b:0}, // for non-supporting envs
        canvas = document.createElement('canvas'),
        context = canvas.getContext && canvas.getContext('2d'),
        data, width, height,
        i = -4,
        length,
        rgb = {r:0,g:0,b:0},
        count = 0;
        
    if (!context) {
        return defaultRGB;
    }
    
    height = canvas.height = imgEl.naturalHeight || imgEl.offsetHeight || imgEl.height;
    width = canvas.width = imgEl.naturalWidth || imgEl.offsetWidth || imgEl.width;
    
    context.drawImage(imgEl, 0, 0);
    
    try {
        data = context.getImageData(0, 0, width, height);
    } catch(e) {
        /* security error, img on diff domain */alert('ignore on startup, issue if not on startup');
        return defaultRGB;
    }
    
    length = data.data.length;
    
    while ( (i += blockSize * 4) < length ) {
        ++count;
        rgb.r += data.data[i];
        rgb.g += data.data[i+1];
        rgb.b += data.data[i+2];
    }
    
    // ~~ used to floor values
    rgb.r = ~~(rgb.r/count);
    rgb.g = ~~(rgb.g/count);
    rgb.b = ~~(rgb.b/count);
    
    return rgb;
    
}

// Function to convert the list to a 2D array
function convertTo2DArray(textureFiles) {
  return textureFiles.map(file => {
    // Remove the file extension and replace underscores with spaces
    const textureName = file.name.replace('.png', '').replace(/_/g, ' ');
    // Return an array with the texture name and path
    return [textureName, file.path];
  });
}

// Convert the list and print the result
const textureArray = convertTo2DArray(textureFiles);

function start() {
  const startButton = document.getElementById("start");
  startButton.remove();
  const testingContainer = document.getElementById("testingContainer");
  testingClippingContainer.style.height = (document.getElementById('testingContainer').clientHeight+40) + "px";
  document.getElementById("CurrentBlock").innerHTML = (i+1) + ": " + textureArray[i][0];
  var img = document.getElementById('i');
  img.crossOrigin = '';
  img.src = 'https://raw.githubusercontent.com/ZtechNetwork/MCBVanillaResourcePack/master/'+textureArray[i][1];
}
